name: Render demo video

# Renders demo-video/ (a HyperFrames project) on a GitHub-hosted runner and
# uploads the MP4 as a workflow artifact. Fonts are embedded by the pinned
# HyperFrames CLI, so the output matches local previews.

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare the bundled browser
        working-directory: demo-video
        run: npx --yes hyperframes@0.9.41 browser ensure
      - name: Check the composition
        working-directory: demo-video
        run: npx --yes hyperframes@0.9.41 check
      - name: Render
        working-directory: demo-video
        run: npx --yes hyperframes@0.9.41 render --quality delivery --video-frame-format png -o renders/recallready-demo.mp4
      - uses: actions/upload-artifact@v7
        with:
          name: recallready-demo
          path: demo-video/renders/recallready-demo.mp4
          retention-days: 30
